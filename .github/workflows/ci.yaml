name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet -tags=integration ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - name: Module tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff

  compatibility:
    name: huggingface_hub compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - name: Real client against the registry (no network)
        run: go test -tags=integration -count=1 -v ./test/e2e/
      - name: Mirror a real model from huggingface.co
        env:
          REGISTRY_E2E_NETWORK: "1"
        run: go test -tags=integration -count=1 -v -run TestMirrorFromHuggingFace ./test/e2e/

  s3:
    name: Real S3-compatible storage
    runs-on: ubuntu-latest
    env:
      REGISTRY_TEST_S3_ENDPOINT: http://127.0.0.1:9005
      REGISTRY_TEST_S3_BUCKET: registry-test
      REGISTRY_TEST_S3_ACCESS_KEY: any
      REGISTRY_TEST_S3_SECRET_KEY: anysecret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - name: Start an S3-compatible server
        run: |
          docker run -d --name s3 -p 127.0.0.1:9005:8333 chrislusf/seaweedfs server -s3 -dir=/data
          for i in $(seq 1 40); do curl -fs -o /dev/null http://127.0.0.1:9005/ && exit 0; sleep 1; done
          docker logs s3; exit 1
      - name: Storage contract, including multipart uploads
        run: go test -count=1 -v ./internal/blob/
      - name: huggingface_hub against an S3-backed registry
        run: go test -tags=integration -count=1 -v -run TestHubClientAgainstS3 ./test/e2e/

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t registry:ci .
      - name: Image starts and answers
        run: |
          docker run -d --name registry -p 8080:8080 registry:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && exit 0
            sleep 1
          done
          docker logs registry
          exit 1
