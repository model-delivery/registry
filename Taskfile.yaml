version: "3"

# Every repeated command lives here. Prefer `task <name>` over raw commands.

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X github.com/model-delivery/registry/internal/cli.Version={{.VERSION}}
  IMAGE: ghcr.io/model-delivery/registry

tasks:
  default:
    desc: Format check, vet and unit tests
    cmds:
      - task: check

  build:
    desc: Build the modelctl binary into bin/
    cmd: go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/ ./cmd/modelctl

  build:targets:
    desc: Check that modelctl compiles for every platform a release is built for (CI runs this too)
    cmds:
      - for: [linux/amd64, linux/arm64, linux/arm, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
        cmd: go build -o {{.DISCARD}} ./cmd/modelctl
        env:
          GOOS: '{{splitList "/" .ITEM | first}}'
          GOARCH: '{{splitList "/" .ITEM | last}}'
          CGO_ENABLED: "0"
    vars:
      DISCARD: '{{if eq OS "windows"}}NUL{{else}}/dev/null{{end}}'

  run:
    desc: Run the registry on http://localhost:8080 with data in ./data
    cmd: go run ./cmd/modelctl serve {{.CLI_ARGS}}

  fmt:
    desc: Format Go sources
    cmd: gofmt -w -s .

  vet:
    desc: Run go vet, including integration-tagged files
    cmd: go vet -tags=integration ./...

  headers:
    desc: Check that every Go file carries the copyright and licence header
    cmd: |
      missing="$(git ls-files '*.go' | while read -r f; do
        head -n 1 "$f" | grep -q '^// Copyright [0-9][0-9][0-9][0-9] Spectrum Labs LLC' &&
          sed -n 2p "$f" | grep -q '^// SPDX-License-Identifier: Apache-2.0' || echo "$f"
      done)"
      test -z "$missing" || (echo "missing the copyright and licence header:"; echo "$missing"; exit 1)

  lint:
    desc: Run golangci-lint (install v2.14.0, the version CI pins)
    cmd: golangci-lint run ./...

  vuln:
    desc: Check dependencies for vulnerabilities reachable from this code
    cmd: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  test:
    desc: Run unit tests (no network, no Python, no Docker)
    cmd: go test ./...

  test:race:
    desc: Run unit tests with the race detector (needs a C compiler)
    cmd: go test -race ./...

  test:e2e:
    desc: Run the huggingface_hub and datasets compatibility tests (needs Python with huggingface_hub, and datasets for load_dataset; no network)
    cmd: go test -tags=integration -count=1 ./test/e2e/

  test:e2e:network:
    desc: Also mirror a real model and real datasets from huggingface.co (needs the network)
    env:
      REGISTRY_E2E_NETWORK: "1"
    cmd: go test -tags=integration -count=1 -v ./test/e2e/

  test:s3:
    desc: Run storage and compatibility tests against a real S3-compatible server in Docker
    env:
      REGISTRY_TEST_S3_ENDPOINT: http://127.0.0.1:9005
      REGISTRY_TEST_S3_BUCKET: registry-test
      REGISTRY_TEST_S3_ACCESS_KEY: any
      REGISTRY_TEST_S3_SECRET_KEY: anysecret
    cmds:
      - docker rm -f registry-test-s3 >/dev/null 2>&1 || true
      - docker run -d --name registry-test-s3 -p 127.0.0.1:9005:8333 chrislusf/seaweedfs:4.54 server -s3 -dir=/data
      - defer: docker rm -f registry-test-s3
      - for i in $(seq 1 40); do curl -fs -o /dev/null http://127.0.0.1:9005/ && break || sleep 1; done
      - go test -count=1 ./internal/blob/
      - go test -tags=integration -count=1 -run TestHubClientAgainstS3 ./test/e2e/

  check:
    desc: Everything CI checks that needs only Go and golangci-lint
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - task: vet
      - task: headers
      - task: lint
      - task: test
      - go mod tidy -diff

  release:
    desc: "Cut a release from main, e.g. task release -- -f bump=minor (runs the Cut release workflow)"
    cmd: gh workflow run release-cut.yaml {{.CLI_ARGS}}

  docker:
    desc: Build the container image for this machine
    cmd: docker build --build-arg VERSION={{.VERSION}} -t {{.IMAGE}}:dev .

  up:
    desc: Start the registry with Docker Compose
    cmd: docker compose up --build -d

  down:
    desc: Stop the Docker Compose registry (data is kept in the volume)
    cmd: docker compose down
