{{define "content"}}
<section class="narrow">
<h1>Sign in</h1>
{{with .Data.Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<form method="post" action="/ui/login">
  <label for="token">Access token</label>
  <input id="token" name="token" type="password" autocomplete="off" required autofocus>
  <button>Sign in</button>
</form>
<p class="hint">Tokens start with <code>md_</code>. The first admin token is printed in the server log on first start; create more with <code>modelctl token create</code>.</p>
</section>
{{end}}
