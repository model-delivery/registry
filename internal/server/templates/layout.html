<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Model Delivery</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/static/icon.svg" alt="" width="20" height="20">Model Delivery</a>
  <nav>
    <a href="/">Repositories</a>
    {{if .Viewer}}
    <form method="post" action="/ui/logout"><span class="who">{{.Viewer}}</span><button class="link">Sign out</button></form>
    {{else}}
    <a href="/ui/login">Sign in</a>
    {{end}}
  </nav>
</header>
<main>
{{if .Flash}}<p class="notice" role="status">{{.Flash}}</p>{{end}}
{{block "content" .}}{{end}}
</main>
<footer>Model Delivery registry {{.Version}}</footer>
</body>
</html>
