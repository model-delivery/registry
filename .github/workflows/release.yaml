# Runs when a version tag (v1.2.3) is pushed. It runs the full gate on the
# tagged commit, publishes the multi-architecture container image, then
# builds the binaries and creates the GitHub release.
#
# Start a release with the "Cut release" button (release-cut.yaml), or by
# pushing a tag yourself:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# A tag with a suffix (v0.2.0-rc.1) is published as a pre-release and does
# not move the `latest` image tag.
#
# Secrets required: none. GITHUB_TOKEN publishes the image and the release.

name: Release

on:
  push:
    tags: ["v*"]
  # release-cut.yaml pushes its tag with GITHUB_TOKEN, and a push made with
  # that token does not start workflows. So it dispatches this workflow on
  # the tag instead, which runs it exactly as a pushed tag would.
  workflow_dispatch: {}

permissions:
  contents: read

# One release at a time, and never cancel one half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-tag:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - name: Must be a version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != tag ] || ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::release.yaml runs on a tag like v1.2.3 or v1.2.3-rc.1, not ${REF_TYPE} '${REF_NAME}'"
            exit 1
          fi

  quality:
    name: Quality
    needs: check-tag
    uses: ./.github/workflows/quality.yaml
    with:
      mirror-from-huggingface: true

  image:
    name: Publish the container image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 publishes 1.2.3, 1.2 and latest. A pre-release
          # (v1.2.3-rc.1) publishes only 1.2.3-rc.1.
          # The version is given explicitly, so this reads the same whether
          # the run was started by a pushed tag or by release-cut.yaml.
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: Publish binaries and the GitHub release
    # After the image, so the release never announces an image that is not
    # there yet.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="modelctl_${VERSION#v}_${os}_${arch}"
            mkdir -p "build/${name}"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/model-delivery/registry/internal/cli.Version=${VERSION}" \
              -o "build/${name}/" ./cmd/modelctl
            cp LICENSE README.md "build/${name}/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/${name}.zip" "${name}")
            else
              tar -C build -czf "dist/${name}.tar.gz" "${name}"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --verify-tag --generate-notes $prerelease
